# Compose override for an immutable Zalip/Misskey release checkout.
#
# Keep the deployment's existing compose file first in the command. It owns the
# secrets, bind mounts, database, Redis, port mapping and Compose project name.
# This override changes only the web-image build context.
#
# Example:
# ZALIP_RELEASE_DIR=/opt/zalip/releases/misskey-<commit> \
#   docker compose -p misskey \
#     -f /opt/zalip/misskey/compose.yml \
#     -f "$ZALIP_RELEASE_DIR/deploy/compose.release.yml" build web

services:
  web:
    # The host resolver on some VDS networks rewrites api.themoviedb.org to a
    # loopback address. Keep this scoped to Misskey so TMDB import has a real,
    # independent resolver without changing DNS for the server or database.
    # Cloudflare's two resolvers provide a fallback during catalogue imports.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    build:
      context: ${ZALIP_RELEASE_DIR:?Set ZALIP_RELEASE_DIR to the immutable release checkout}
    environment:
      ZALIP_TMDB_API_KEY: ${ZALIP_TMDB_API_KEY:-}
      # Kept in the server-only env file. Never expose provider credentials to clients.
      ZALIP_ALLOHA_API_TOKEN: ${ZALIP_ALLOHA_API_TOKEN:-}
      # Optional exact iframe host allowlist; the application uses its safe default if empty.
      ZALIP_ALLOHA_IFRAME_HOSTS: ${ZALIP_ALLOHA_IFRAME_HOSTS:-}
