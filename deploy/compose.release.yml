# Compose override for an immutable Zalip/Misskey release checkout.
#
# Keep the deployment's existing compose file first in the command. It owns the
# secrets, bind mounts, database, Redis, port mapping and Compose project name.
# This override changes only the web-image build context.
#
# Example:
# ZALIP_RELEASE_DIR=/opt/zalip/releases/misskey-<commit> \
#   docker compose -p misskey \
#     -f /opt/zalip/misskey/compose.yml \
#     -f "$ZALIP_RELEASE_DIR/deploy/compose.release.yml" build web

services:
  web:
    # The host resolver on some VDS networks rewrites api.themoviedb.org to a
    # loopback address. Keep this scoped to Misskey so TMDB import has a real,
    # independent resolver without changing DNS for the server or database.
    # Cloudflare's two resolvers provide a fallback during catalogue imports.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    build:
      context: ${ZALIP_RELEASE_DIR:?Set ZALIP_RELEASE_DIR to the immutable release checkout}
    environment:
      ZALIP_TMDB_API_KEY: ${ZALIP_TMDB_API_KEY:-}
      # API credentials stay server-side except for the administrator settings UI.
      ZALIP_ALLOHA_API_TOKEN: ${ZALIP_ALLOHA_API_TOKEN:-}
      # This explicit public token is included in Alloha iframe URLs.
      ZALIP_ALLOHA_PLAYER_TOKEN: ${ZALIP_ALLOHA_PLAYER_TOKEN:-}
      # Persist separately from the database: 32 random bytes in base64.
      ZALIP_IMPORTER_SETTINGS_KEY: ${ZALIP_IMPORTER_SETTINGS_KEY:-}
      ZALIP_TMDB_API_ORIGIN: ${ZALIP_TMDB_API_ORIGIN:-}
      ZALIP_KINOPOISK_API_ORIGIN: ${ZALIP_KINOPOISK_API_ORIGIN:-}
      ZALIP_ALLOHA_API_ORIGIN: ${ZALIP_ALLOHA_API_ORIGIN:-}
      ZALIP_COLLAPS_API_ORIGIN: ${ZALIP_COLLAPS_API_ORIGIN:-}
      ZALIP_ALLOHA_PLAYER_ORIGIN: ${ZALIP_ALLOHA_PLAYER_ORIGIN:-}
      ZALIP_COLLAPS_PLAYER_ORIGIN: ${ZALIP_COLLAPS_PLAYER_ORIGIN:-}
      # Optional exact iframe host allowlist; the application uses its safe default if empty.
      ZALIP_ALLOHA_IFRAME_HOSTS: ${ZALIP_ALLOHA_IFRAME_HOSTS:-}
      ZALIP_KINOPOISK_API_KEY: ${ZALIP_KINOPOISK_API_KEY:-}
      ZALIP_KINOPOISK_DAILY_BUDGET: ${ZALIP_KINOPOISK_DAILY_BUDGET:-350}
      ZALIP_COLLAPS_API_TOKEN: ${ZALIP_COLLAPS_API_TOKEN:-}
      ZALIP_COLLAPS_IFRAME_HOSTS: ${ZALIP_COLLAPS_IFRAME_HOSTS:-}
      ZALIP_KODIK_API_TOKEN: ${ZALIP_KODIK_API_TOKEN:-}
      ZALIP_KODIK_API_ORIGIN: ${ZALIP_KODIK_API_ORIGIN:-}
      ZALIP_KODIK_PLAYER_ORIGIN: ${ZALIP_KODIK_PLAYER_ORIGIN:-}
      ZALIP_KODIK_IFRAME_HOSTS: ${ZALIP_KODIK_IFRAME_HOSTS:-}
